<!doctype html>
<!-- export * from "./leaf-a.html"; export * from "./leaf-b.html"
     - alpha is shadowed by the local export below
     - clash differs between the two, so it is ambiguous and dropped
     - shared is the same binding on both sides (a diamond), so it stays
     - neither default is re-exported -->
<module-export from="./leaf-a.html" all></module-export>
<module-export from="./leaf-b.html" all></module-export>
<script type="application/json" export="alpha">{ "from": "mid-1.html", "note": "local export shadows export *" }</script>
<script type="application/json" export="version">{ "from": "mid-1.html", "version": 1 }</script>
