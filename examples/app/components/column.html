<!doctype html>
<template export="Column">
  <style>
    :host { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.75rem; border-radius: 12px; min-height: 8rem;
            background: color-mix(in srgb, var(--board-accent) 7%, var(--surface-2)); border-top: 3px solid var(--board-accent); }
    h2 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 0.2rem; font-size: 0.95rem; }
    .count { font-size: 0.75rem; font-weight: 600; padding: 0 0.5rem; border-radius: 99px; background: var(--surface); color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  </style>
  <h2><slot name="title">Column</slot><span class="count" part="count"><slot name="count">0</slot></span></h2>
  <slot><p class="empty">Nothing here.</p></slot>
</template>
