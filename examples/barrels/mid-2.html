<!doctype html>
<!-- export { gamma, hello as greet } from "./leaf.js" -->
<export from="./leaf.js">
  <binding name="gamma"></binding>
  <binding name="hello" as="greet"></binding>
</export>
<!-- export { default as aDefault } from "./leaf-a.html"  (single-binding shorthand) -->
<module-export from="./leaf-a.html" name="default" as="aDefault"></module-export>
<!-- export * from "./leaf.js"  (gamma is also named above: same binding, no conflict; default skipped) -->
<module-export from="./leaf.js" all></module-export>
<!-- export * as b from "./leaf-b.html"  (a namespace object, default included) -->
<module-export from="./leaf-b.html" namespace="b"></module-export>
<script type="application/json" export="version">{ "from": "mid-2.html", "version": 2 }</script>
