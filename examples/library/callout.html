<!doctype html>
<template export="Callout">
  <style>
    :host { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.7rem 0.9rem; border-radius: var(--lib-radius);
            background: var(--lib-accent-soft); color: var(--lib-text); border-left: 4px solid var(--lib-accent); font-family: var(--lib-font); }
    :host([tone="ok"])   { background: var(--lib-ok-soft);   border-color: var(--lib-ok); }
    :host([tone="warn"]) { background: var(--lib-warn-soft); border-color: var(--lib-warn); }
    :host([tone="bad"])  { background: var(--lib-bad-soft);  border-color: var(--lib-bad); }
    .icon { flex: none; line-height: 0; padding-top: 0.15rem; color: var(--lib-accent); }
    :host([tone="ok"]) .icon { color: var(--lib-ok); }
    :host([tone="warn"]) .icon { color: var(--lib-warn); }
    :host([tone="bad"]) .icon { color: var(--lib-bad); }
  </style>
  <span class="icon" part="icon"><slot name="icon"></slot></span>
  <div part="body"><slot></slot></div>
</template>
