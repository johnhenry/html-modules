<!--
  Form-associated components: `form-associated` makes the element take part in forms (static formAssociated +
  ElementInternals): its name and value reach FormData, it validates, it is disabled by a disabled <fieldset>,
  and it resets and restores with the form.

  form-control="input" names the control in the template whose value is the form value; without it, the element
  is the control: set `el.value`.
-->
<html-export name="text-field" form-associated form-control="input" delegates-focus>
  <style>
    :host { display: inline-block; }
    label { display: grid; gap: 0.15rem; font: inherit; }
    input { font: inherit; padding: 0.3rem 0.45rem; }
    :host(:state(touched):invalid) input, :host(:invalid) input:not(:placeholder-shown) { outline: 2px solid #c0392b; }
  </style>
  <template><label><span><slot>Label</slot></span><input type="text" placeholder=" "></label></template>
</html-export>

<html-export name="star-input" form-associated props="max:number">
  <style>
    :host { display: inline-flex; gap: 0.15rem; font-size: 1.4rem; cursor: pointer; }
    :host(:disabled) { opacity: 0.4; cursor: not-allowed; }
    :host(:invalid) { outline: 2px solid #c0392b; }
    button { all: unset; cursor: inherit; }
  </style>
  <template><button type="button" data-n="1">☆</button><button type="button" data-n="2">☆</button><button type="button" data-n="3">☆</button><button type="button" data-n="4">☆</button><button type="button" data-n="5">☆</button></template>
</html-export>

<html-export name="secret-field" form-associated form-control="input" shadow="closed">
  <style>:host { display: inline-block; } input { font: inherit; padding: 0.3rem 0.45rem; }</style>
  <template><input type="password"></template>
</html-export>

<!--
  A required text field with no delegates-focus written: a component with a form-control delegates focus to it by
  default, so the browser can focus (and describe) the invalid control when its form is validated.
-->
<html-export name="note-field" form-associated form-control="input">
  <style>:host { display: inline-block; } input { font: inherit; padding: 0.3rem 0.45rem; }</style>
  <template><label><slot>Note</slot> <input type="text"></label></template>
</html-export>

<!--
  Buttons for a form made of components. A custom element cannot be a native submit or reset button, so form-role
  says it is one: click, Enter and Space activate it (it gets tabindex="0" if it has none), a submit button is the
  form's default button (Enter in a text field of the form activates it, unless it is disabled), and it adds nothing
  to the form's data. The submit event's `submitter` is the element.
-->
<html-export name="submit-button" form-associated form-role="submit">
  <style>
    :host { display: inline-block; padding: 0.3rem 0.8rem; border: 1px solid #3b6fd4; border-radius: 6px; background: #3b6fd4; color: #fff; cursor: pointer; user-select: none; }
    :host(:focus-visible) { outline: 2px solid #1d3f8f; outline-offset: 2px; }
    :host(:disabled) { opacity: 0.4; cursor: not-allowed; }
  </style>
  <template><slot>Submit</slot></template>
</html-export>

<html-export name="reset-button" form-associated form-role="reset">
  <style>
    :host { display: inline-block; padding: 0.3rem 0.8rem; border: 1px solid #888; border-radius: 6px; cursor: pointer; user-select: none; }
    :host(:focus-visible) { outline: 2px solid #1d3f8f; outline-offset: 2px; }
    :host(:disabled) { opacity: 0.4; cursor: not-allowed; }
  </style>
  <template><slot>Reset</slot></template>
</html-export>
