<!doctype html>
<!-- An HTML module: exported nodes form its namespace; everything else is private. -->
<template id="helper"><p>Private: not exported.</p></template>

<template export="Card">
  <style>
    article { border: 2px solid var(--accent, rebeccapurple); border-radius: 10px; padding: 0.8rem 1rem; margin: 0.5rem 0; background: var(--surface, transparent); }
  </style>
  <article><slot></slot></article>
</template>

<template export="default">
  <strong style="color: var(--ok, teal)"><slot></slot></strong>
</template>

<style export="theme">
  .quickstart h1 { color: var(--accent); }
  .quickstart demo-counter button, .quickstart other-counter button { font-variant-numeric: tabular-nums; }
</style>

<script type="application/json" export="config">{ "brand": "demo" }</script>

<script type="module" export="controller">
  export const greet = (name) => `Hello, ${name}!`;
</script>
