<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>errors: throw</title>
  <script>try { const t = localStorage.getItem('html-modules-examples-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="../shared/site.css">
  <style>body { background: var(--surface); } .frame { display: grid; gap: .6rem; padding: 12px; }</style>
  <script>
    // Anything reported with reportError() reaches window.onerror, like an
    // uncaught exception. Returning true marks it handled, so this demo
    // captures the errors instead of printing them to the console.
    window.captured = [];
    window.onerror = (message, source, line, column, error) => {
      window.captured.push(error ?? message);
      document.dispatchEvent(new CustomEvent('captured'));
      return true;
    };
  </script>
  <script type="module" src="../../src/browser.js"></script>
</head>
<body>
  <html-import-settings errors="throw"></html-import-settings>

  <!-- An invalid module, a missing export, and one import that opts back into events only. -->
  <html-import id="invalid" src="../errors/dup-export.html" as="dup"></html-import>
  <html-import id="binding" src="../components/ui.html" as="ui"><html-binding export="nope"></html-binding></html-import>
  <html-import id="quiet" src="../errors/bad-name.html" as="quiet" errors="event"></html-import>

  <div class="frame">
    <p class="label">window.onerror received</p>
    <div id="log" class="log"></div>
    <p class="label">error events</p>
    <div id="events" class="log"></div>
  </div>
  <script type="module">
    const text = (e) => `${e.name}: ${e.message}`.replace(location.origin, '');
    const events = [];
    document.addEventListener('error', (e) => {
      if (!e.detail?.error) return;
      events.push({ on: e.target.id || e.target.localName, error: e.detail.error });
      document.getElementById('events').insertAdjacentHTML('beforeend', `<div>#${e.target.closest('html-import')?.id}: ${text(e.detail.error).replace(/</g, '&lt;')}</div>`);
    });
    const render = () => {
      document.getElementById('log').innerHTML = window.captured.map((e) => `<div>${text(e).replace(/</g, '&lt;')}</div>`).join('');
    };
    document.addEventListener('captured', render);
    render();
    const imports = [...document.querySelectorAll('html-import')];
    window.result = Promise.allSettled(imports.map((el) => el.ready))
      .then(() => new Promise((r) => setTimeout(r, 50)))
      .then(() => ({ captured: window.captured.map((e) => e.message ?? String(e)), events: events.map((e) => e.error.message) }));
  </script>
</body>
</html>
