<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>conflict: reuse</title>
  <script>try { const t = localStorage.getItem('html-modules-examples-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="../shared/site.css">
  <style>body { background: var(--surface); } .frame { display: grid; gap: .6rem; padding: 12px; } .row { font-size: 1.4rem; }</style>
  <!-- 1. A compiled copy of icons.html, built with --format register --as reg: it registers <reg--star>, <reg--heart>, … on import. -->
  <script type="module" src="../compiled/icons.register.js"></script>
  <!-- 2. Then the runtime, which imports the HTML source of the same module under the same namespace. -->
  <script type="module" src="../../src/browser.js"></script>
</head>
<body>
  <html-import-settings conflict="reuse"></html-import-settings>
  <html-import id="icons" src="../components/icons.html" as="reg"></html-import>

  <div class="frame">
    <div class="row"><reg--star></reg--star><reg--heart></reg--heart><reg--check></reg--check></div>
    <pre id="info" class="small"></pre>
  </div>
  <script type="module">
    const el = document.getElementById('icons');
    const out = document.getElementById('info');
    window.result = el.ready.then(
      (detail) => {
        out.textContent = Object.values(detail.tags).map((t) => JSON.stringify(t)).join('\n');
        return { ok: true, tags: detail.tags, compiled: customElements.get('reg--star').component !== detail.module.star };
      },
      (error) => {
        out.textContent = `${error.name}: ${error.message.replace(location.origin, '')}`;
        out.className = 'error-box';
        return { ok: false, message: error.message };
      },
    );
  </script>
</body>
</html>
