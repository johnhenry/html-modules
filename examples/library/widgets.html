<!doctype html>
<!-- A mid-level barrel: local exports mixed with re-exports from HTML and JS. -->
<module-export from="./stat.html" all></module-export>
<module-export from="./tabs.js" all></module-export>
<!-- The same JS file as a module-script export: its value is the JS namespace. -->
<script type="module" src="./tabs.js" export="tabsModule"></script>
