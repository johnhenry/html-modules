<!doctype html>
<!-- Design tokens for the component library. Custom properties cross shadow
     boundaries, so one adopted document sheet themes every component. -->
<style export="tokens">
  :root {
    --lib-radius: 12px;
    --lib-surface: var(--surface, #fff);
    --lib-surface-2: var(--surface-2, #f4f4f4);
    --lib-border: var(--border, #ddd);
    --lib-text: var(--text, #111);
    --lib-muted: var(--muted, #666);
    --lib-accent: var(--accent, #5b4bd6);
    --lib-accent-soft: var(--accent-soft, #ebe8ff);
    --lib-ok: var(--ok, #1f7a4a);
    --lib-ok-soft: var(--ok-soft, #e1f3e8);
    --lib-warn: var(--warn, #8a5a00);
    --lib-warn-soft: var(--warn-soft, #fbf0d9);
    --lib-bad: var(--bad, #b3261e);
    --lib-bad-soft: var(--bad-soft, #fbe6e4);
    --lib-shadow: var(--shadow, none);
    --lib-font: var(--font, system-ui, sans-serif);
  }
</style>

<script type="application/json" export="config">
  { "name": "tiny-ui", "version": "2.1.0", "tones": ["accent", "ok", "warn", "bad"] }
</script>

<!-- "+json" types are JSON too. -->
<script type="application/ld+json" export="meta">
  { "@type": "SoftwareSourceCode", "name": "tiny-ui", "programmingLanguage": "HTML" }
</script>
