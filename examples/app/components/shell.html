<!doctype html>
<!-- App layout: header, toolbar, board and status bar slots. -->
<template export="default">
  <style>
    :host { display: grid; gap: 1rem; }
    header { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
    .board { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); align-items: start; }
    footer { font: 0.78rem/1.4 var(--mono, monospace); color: var(--muted); border-top: 1px solid var(--border); padding-top: 0.6rem; }
  </style>
  <header part="header"><slot name="title"></slot><slot name="stats"></slot></header>
  <slot name="toolbar"></slot>
  <div class="board" part="board"><slot></slot></div>
  <footer part="status"><slot name="status"></slot></footer>
</template>
