<!doctype html>
<!-- The top barrel re-exports two barrels, which re-export leaves. -->
<module-export from="./mid-1.html" all></module-export>
<module-export from="./mid-2.html" all></module-export>
<!-- export * as mid1 from "./mid-1.html" -->
<module-export from="./mid-1.html" namespace="mid1"></module-export>
<!-- Reach past mid-1's shadowing: export { alpha as rawAlpha } from "./leaf-a.html" -->
<module-export from="./leaf-a.html">
  <module-binding name="alpha" as="rawAlpha"></module-binding>
</module-export>
<template export="default"><strong>top.html default</strong></template>
