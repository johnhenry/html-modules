# Publishes through the shared reusable workflow (johnhenry/workflows npm-publish.yml@v1): install, gate, then the
# idempotent `npm view` guard and `npm publish --provenance --access public`. The reusable workflow's guard treats any
# non-zero `npm view` exit (including the E404 of a never-published scoped package) as "not published yet".
#
# Triggers: `release: published` and `workflow_dispatch`, plus a redundant `push: tags: v*`. Creating a release soon
# after a push to the same commit can silently drop the release event for a job whose body is `uses: <external-repo>`
# (see johnhenry/workflows' README); the tag push is a second, idempotent chance (the `npm view` guard makes a repeat a
# no-op). To retry a failed publish: Actions > Publish to npm > Run workflow.
#
# Deviation from the shared gate: the browser suite (Chromium, Firefox, WebKit) is part of the full gate here, so the
# gate-commands install Playwright browsers and run `npm run test:browser` on top of the family commands.

name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # npm provenance: the reusable workflow's job needs it, and the caller must grant it too
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      gate-commands: |
        npm run check
        npm test
        npm run types:check
        npm run examples
        npm pack --dry-run
        npx playwright install --with-deps
        npm run test:browser
    secrets: inherit
