<!doctype html>
<meta charset="utf-8">
<title>ui: a small component module</title>

<html-export name="custom-card">
  <style>:host { display: block; border: 1px solid; }</style>
  <template>
    <article class="card">
      <header><slot name="title"></slot></header>
      <slot></slot>
    </article>
  </template>
</html-export>

<html-export name="fancy-button" delegates-focus>
  <template><button part="button"><slot></slot></button></template>
</html-export>

<html-export name="theme">
  <style>:root { --accent: rebeccapurple; }</style>
</html-export>

<html-export name="config">
  <script type="application/json">{ "size": 3, "brand": "Acme" }</script>
</html-export>

<html-export name="note" default>
  <template><aside class="note"><slot></slot></aside></template>
</html-export>

<p>Markup that is not exported stays private to the module.</p>
