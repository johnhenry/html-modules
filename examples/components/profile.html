<!--
  Data binding: {{attribute}} in a template reads the host element's attribute.
  props="…" declares which attributes are properties too (reflected, typed, observed);
  any attribute a template mentions is observed even when it is not declared.
  No expressions: a binding is only ever an attribute name.
-->
<html-export name="user-card" props="name role count:number open:boolean">
  <style>
    :host { display: block; }
    article { border: 1px solid var(--border, #ccc); border-radius: 8px; padding: 0.75rem 1rem; max-width: 28rem; }
    h3 { margin: 0 0 0.25rem; }
    .meta { color: var(--muted, #666); margin: 0 0 0.5rem; }
    a, button { margin-right: 0.5rem; }
  </style>
  <template>
    <article part="card">
      <h3>{{name}}</h3>
      <p class="meta">{{role}} · <span class="posts">{{count}}</span> posts</p>
      <a class="profile" href="/users/{{name}}" title="Profile of {{name}} ({{count}} posts)">profile</a>
      <a class="website" href="{{website}}">website</a>
      <button disabled="{{off}}">Follow</button>
      <p class="literal">Write \{{name}} to print the braces.</p>
    </article>
  </template>
</html-export>
