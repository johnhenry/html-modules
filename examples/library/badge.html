<!doctype html>
<template export="Badge">
  <style>
    :host { display: inline-flex; align-items: center; gap: 0.25rem; font: 600 0.72rem/1.7 var(--lib-font);
            padding: 0 0.55rem; border-radius: 999px; background: var(--lib-accent-soft); color: var(--lib-accent); white-space: nowrap; }
    :host([tone="ok"])   { background: var(--lib-ok-soft);   color: var(--lib-ok); }
    :host([tone="warn"]) { background: var(--lib-warn-soft); color: var(--lib-warn); }
    :host([tone="bad"])  { background: var(--lib-bad-soft);  color: var(--lib-bad); }
  </style>
  <slot></slot>
</template>
