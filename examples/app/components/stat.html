<!doctype html>
<template export="Stat">
  <style>
    :host { display: inline-grid; padding: 0.35rem 0.8rem; border-radius: 10px; background: var(--surface-2); min-width: 5.5rem; }
    ::slotted([slot="value"]) { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--board-accent); }
    ::slotted([slot="label"]) { font-size: 0.72rem; color: var(--muted); }
  </style>
  <slot name="value"></slot><slot name="label"></slot>
</template>
