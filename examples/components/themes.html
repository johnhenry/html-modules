<!-- Stylesheet exports: <html-export> with only <style> children. Adopt one with
     <html-binding export="ocean" adopt>, or programmatically. -->
<html-export name="ocean"><style>:root, :host { --brand: #0f6fb3; --brand-soft: #dcecf8; }</style></html-export>
<html-export name="sunset"><style>:root, :host { --brand: #c2410c; --brand-soft: #fde6d8; }</style></html-export>
<html-export name="forest"><style>:root, :host { --brand: #2f7d32; --brand-soft: #e0f0e0; }</style></html-export>
<html-export name="gold"><style>:host { --gold: #d4a017; }</style></html-export>
