name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The family gate (install, checks, tests, examples, types, pack) is the shared reusable workflow. It carries the
  # concurrency-cancel block itself, and node-versions is the engines floor (26). `npm ci` is the reusable's default
  # install: the safe-fragment git devDependency is recorded as git+https in package-lock.json, which CI can clone
  # (npm rewrites it to git+ssh on a local `npm install`; AGENTS.md says to change it back).
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm run check
        npm test
        npm run types:check
        npm run examples
        npm pack --dry-run

  # Deviation from the shared workflow: real browsers. linkedom (the unit-test DOM) has no constructable stylesheets,
  # Trusted Types or custom-element upgrade semantics inside shadow roots, so rendering, styles, forms and security are
  # proven in Chromium, Firefox and WebKit against every examples/*.html page and the targeted specs in test/browser/.
  # It stays a local job (Playwright browsers, benchmark, trace artifact); it has its own concurrency group because the
  # reusable workflow's group is named from github.workflow too and a shared name would cancel the called run.
  browsers:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-browsers-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      # Non-gating: the numbers (README, Benchmarks) on a CI runner, per engine.
      - name: Benchmark
        run: npm run bench
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # No separate generated-<what> job: examples/compiled/ is generated (npm run examples:compile) and committed, but it
  # does NOT ship (files is src + bin), and "examples/compiled/ is up to date" in test/examples.test.js already fails
  # npm test when it drifts, so the reusable workflow's drift-check stays off.
